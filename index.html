'use strict';
(() => {
 const $ = id => document.getElementById(id);

 function makeID(n=6){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let z='';for(let i=0;i<n;i++)z+=chars[Math.floor(Math.random()*chars.length)];return z}
 function setStatus(s,bad=false){connectionState=s;statusEl.textContent=s;statusEl.className='status'+(bad?' bad':'')}

 function commonHeader(){return toast?`<div class="notice" id="msg">${enc(toast)}</div>`:''}

 function setName(v){meName=String(v||'').trim().slice(0,22)||'Player';localStorage.setItem('saywhat-free-name',meName)}
 function peerErrors(p){p.on('error',err=>{setStatus('CONNECTION ISSUE',true);if(err?.type==='unavailable-id'&&role==='host'){message('That room code is already in use. Try creating a new room.');cleanup();render();return}message('Connection problem: '+(err?.message||err?.type||'Please retry'));if(role==='client')scheduleReconnect()});p.on('disconnected',()=>{setStatus('RECONNECTING',true);if(role==='client')scheduleReconnect();else setTimeout(()=>{if(role==='host'&&peer&&!peer.destroyed&&peer.disconnected){try{peer.reconnect()}catch{}}},1000)})}
 function home(){return `<section class="spaced"><div class="eyebrow">EVERYONE PLAYS • NO PAID SERVER</div><h1>Can you <span>say it?</span></h1><p class="lead">Read the nonsense out loud. Guess the real phrase before the clock runs out. Everyone answers on their own phone and competes for points!</p></section><section class="panel"><h2>Join the fun</h2><div class="field"><label for="playerName">Your player name</label><input id="playerName" maxlength="22" autocomplete="nickname" placeholder="Your name" value="${enc(meName)}"></div><button class="btn primary fill" id="createBtn">Create a game</button><p class="tiny muted center topspace">One person creates the room. Everyone else joins using the code.</p><div class="field"><label for="roomInput">Enter a room code</label><input id="roomInput" inputmode="text" maxlength="6" autocomplete="off" placeholder="ABC123" value="${enc(new URLSearchParams(location.search).get('room')||'')}"></div><button class="btn outline fill" id="joinBtn">Join someone's game</button></section><section class="panel"><h3>How it works</h3><p class="tiny">Each player joins on Android or iPhone. Choose 30, 60 or 90 seconds, up to 20 rounds, and compete for the fastest correct answers. The host must keep their phone and the game open.</p><p class="tiny">Free peer-to-peer mode uses the public PeerJS connection service. Internet access is required and some mobile networks or firewalls may block connections. No registration required to play.</p></section>`}
 function settingsHTML(){return `<section class="panel"><h2>Set up your game</h2><p>Choose the settings, then open a private room for your friends.</p><div class="field"><label for="category">Category</label><select id="category"><option value="All">Surprise me — all categories</option>${cats.map(x=>`<option value="${enc(x)}">${enc(x)}</option>`).join('')}</select></div><div class="cols"><div class="field"><label for="difficulty">Difficulty</label><select id="difficulty"><option value="all">Mixed</option><option value="1">Easy</option><option value="2">Medium</option><option value="3">Hard</option></select></div><div class="field"><label for="seconds">Round timer</label><select id="seconds"><option value="60">60 seconds</option><option value="30">30 seconds</option><option value="90">90 seconds</option></select></div><div class="field"><label for="roundCount">Rounds</label><select id="roundCount"><option value="10">10 rounds</option><option value="5">5 rounds</option><option value="15">15 rounds</option><option value="20">20 rounds</option></select></div></div><button class="btn primary fill" id="openRoom">Open my room</button><button class="btn outline fill topspace" id="backHome">Back</button></section>`}
 function playerLine(p){return `<div class="player"><div><strong>${enc(p.name)} ${p.id===clientId?'(you)':''}</strong><small>${p.id===hostId()?'Host · ':''}${p.connected?'Connected':'Disconnected'}${p.correct?' · Guessed it!':''}</small></div><div><strong>${p.score} pts</strong></div></div>`}
 function hostId(){return role==='host'?clientId:remoteState?.hostId}
 function gameState(){if(role==='host')return snapshot(clientId);return remoteState||{phase:'connecting',players:[],settings:{seconds:60,rounds:10}}}
 function lobbyHTML(s){return `<section><p class="eyebrow">READY TO PLAY</p><h2>Your game room</h2><div class="roomcode"><small>SHARE THIS ROOM CODE</small><strong>${enc(room)}</strong></div><div class="two"><button class="btn mint small" id="shareBtn">Share invite</button><button class="btn outline small" id="copyBtn">Copy code</button></div><section class="panel"><div class="row"><h3>Players joined</h3><span class="pill">${s.players.length}/10</span></div><div class="players">${s.players.map(playerLine).join('')}</div>${role==='host'?`<p class="tiny muted">Share the game file or free website link plus this code. Have everyone join before you start.</p><button class="btn primary fill" id="startBtn" ${s.players.length<2?'disabled':''}>Start game (${s.players.length} players)</button>`:`<p class="center muted">Waiting for the host to start the game…</p>`}</section><section class="panel"><h3>Game settings</h3><p>${enc(s.settings.category)} · ${enc(s.settings.difficulty==='all'?'Mixed difficulty':String(s.settings.difficulty))} · ${s.settings.rounds} rounds · ${s.settings.seconds} seconds each</p></section><button class="btn outline fill" id="leaveBtn">Leave room</button></section>`}
 function scoreboard(s){let sorted=[...s.players].sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));return `<section class="panel"><h3>Live leaderboard</h3><div class="players">${sorted.map((p,i)=>`<div class="player"><div><strong>${i+1}. ${enc(p.name)} ${p.id===clientId?'(you)':''}</strong><small>${p.connected?'Online':'Offline'} ${p.correct?' · ✓ Correct':''}</small></div><strong>${p.score} pts</strong></div>`).join('')}</div></section>`}
 function playHTML(s){const left=Math.max(0,s.remainingMs/1000);const me=s.me||{};return `<div class="roundhead"><div><span class="eyebrow">ROUND ${s.roundNo} OF ${s.settings.rounds}</span><h2>${s.phase==='round'?'Say it out loud!':'Round complete'}</h2><span class="pill">${enc(s.card?.cat||'Any category')}</span></div><div class="timer" id="timerRing"><div><strong id="timerText">${Math.ceil(left)}</strong><small>seconds</small></div></div></div><div class="puzzle"><div class="row"><small>WHAT DOES THIS SOUND LIKE?</small><small>${s.phase==='round'?'GUESS!':'REVEALED'}</small></div><strong>${enc(s.card?.g||'')}</strong><footer>Read it aloud, quickly!</footer></div>${s.phase==='round'?`<div class="row"><span class="pill">${me.score||0} points</span><span class="tiny muted">${me.correct?'Correct answer submitted':me.hinted?'Hint used':'Your answer counts!'}</span></div>${me.correct?`<div class="ok">Correct! You scored ${me.lastAward||0} point${me.lastAward===1?'':'s'}. Wait for the reveal.</div>`:`<form class="guess" id="guessForm"><input aria-label="Your answer" id="guessInput" maxlength="80" placeholder="Type the real phrase" autocomplete="off" spellcheck="false"><button class="btn mint" type="submit">Guess</button></form>${lastWrong?`<div class="notice">${enc(lastWrong)}</div>`:''}<button class="btn outline fill" id="hintBtn" ${me.hinted?'disabled':''}>${me.hinted?'Hint used':'Need a hint? (fewer points)'}</button>${me.hint?`<div class="hint"><strong>Hint:</strong> ${enc(me.hint)}</div>`:''}`}`:`<section class="panel center"><span class="eyebrow">THE ANSWER</span><div class="answer">${enc(s.answer||'')}</div><p>${enc(s.card?.h||'')}</p>${role==='host'?`<button class="btn primary fill" id="nextBtn">${s.roundNo>=s.settings.rounds?'Show final winners':'Next round →'}</button>`:`<p class="muted">Waiting for the host to continue…</p>`}</section>`}${scoreboard(s)}<button class="btn outline small fill" id="leaveBtn">Leave game</button>`}
 function finalHTML(s){const winner=[...s.players].sort((a,b)=>b.score-a.score)[0];return `<section class="center"><span class="eyebrow">GAME OVER</span><h1>And the winner is…</h1><h2 class="topspace" style="color:var(--yellow)">${enc(winner?.name||'Everyone!')}</h2><p class="lead">${winner?winner.score+' points — nicely done!':'Thanks for playing!'}</p></section>${scoreboard(s)}${role==='host'?`<button id="againBtn" class="btn primary fill">Play again with same players</button>`:`<p class="panel center">Waiting for the host to set up another round.</p>`}<button id="leaveBtn" class="btn outline fill topspace">Leave game</button>`}
 function render(){const oldInput=$('guessInput');const keep=oldInput?{v:oldInput.value,focused:document.activeElement===oldInput,sel:oldInput.selectionStart}:null;let html=commonHeader();if(phase==='home')html+=home();else if(phase==='setup')html+=settingsHTML();else if(phase==='connecting')html+=`<section class="panel center"><h2>Connecting…</h2><p>Please keep this screen open while we reach the other players.</p><button class="btn outline fill" id="leaveBtn">Cancel</button></section>`;else if(phase==='game'){const s=gameState();if(s.phase==='lobby')html+=lobbyHTML(s);else if(s.phase==='round'||s.phase==='reveal')html+=playHTML(s);else if(s.phase==='finished')html+=finalHTML(s);else html+=`<section class="panel"><h2>Reconnecting</h2><p>Trying to reconnect to room ${enc(room)}…</p><button class="btn primary fill" id="retryBtn">Retry now</button><button class="btn outline fill topspace" id="leaveBtn">Exit game</button></section>`}
 view.innerHTML=html;const newInput=$('guessInput');if(newInput&&keep){newInput.value=keep.v;if(keep.focused){newInput.focus();try{newInput.setSelectionRange(keep.sel,keep.sel)}catch{}}}bind();updateTimer()}
 function bind(){const on=(id,event,fn)=>$(id)?.addEventListener(event,fn);
 on('createBtn','click',()=>{setName($('playerName')?.value);phase='setup';render()});on('joinBtn','click',()=>joinRoom($('roomInput')?.value,$('playerName')?.value));on('backHome','click',()=>{phase='home';render()});on('openRoom','click',()=>{settings={category:$('category').value,difficulty:$('difficulty').value,seconds:Number($('seconds').value),rounds:Number($('roundCount').value)};createRoom()});on('startBtn','click',()=>dispatch({type:'start'}));on('nextBtn','click',()=>dispatch({type:'next'}));on('againBtn','click',()=>dispatch({type:'again'}));on('hintBtn','click',()=>dispatch({type:'hint'}));on('guessForm','submit',e=>{e.preventDefault();const field=$('guessInput');const v=field?.value.trim();if(v){field.value='';dispatch({type:'guess',guess:v})}});on('leaveBtn','click',cleanup);on('retryBtn','click',()=>{reconnecting=false;tryReconnect()});on('shareBtn','click',shareInvite);on('copyBtn','click',copyCode)}
 function createRoom(){if(!hasPeer())return;room=makeID(6);role='host';players=new Map();peers=new Map();setStatus('CONNECTING',true);phase='connecting';render();try{peer=new Peer(prefix+room,{debug:0})}catch(err){setStatus('ERROR',true);message(err.message);cleanup();return}peerErrors(peer);peer.on('open',()=>{players.set(clientId,{id:clientId,name:meName||'Host',score:0,connected:true,correct:false,hinted:false,lastAward:0});stage='lobby';roundNo=0;deck=deckForSettings();lastWrong='';hasJoined=true;setStatus('HOST ONLINE');phase='game';startTicker();render();broadcast()});peer.on('connection',conn=>attachPlayer(conn))}
 function joinRoom(code,name){if(!hasPeer())return;code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==6){message('Enter the six-character room code.');return}setName(name);room=code;role='client';phase='connecting';hasJoined=false;setStatus('CONNECTING',true);render();startClientPeer()}
 function startClientPeer(){if(role!=='client')return;try{peer?.destroy();peer=new Peer(undefined,{debug:0});peerErrors(peer);peer.on('open',()=>openHostConnection());peer.on('close',()=>scheduleReconnect())}catch(err){message('Unable to open connection: '+err.message);scheduleReconnect()}}
 function openHostConnection(){if(role!=='client'||!peer||peer.destroyed)return;try{hostConn=peer.connect(prefix+room,{reliable:true});hostConn.on('open',()=>{clearTimeout(reconnectTimer);reconnecting=false;setStatus('CONNECTED');hostConn.send({type:'join',id:clientId,name:meName});});hostConn.on('data',msg=>{if(!msg)return;if(msg.type==='error'){message(msg.message||'Unable to join room');return;}if(msg.type==='feedback'){lastWrong=msg.message;render();return;}if(msg.type!=='state')return;remoteState=msg.state;hasJoined=true;phase='game';setStatus('CONNECTED');lastWrong='';render()});hostConn.on('close',()=>{if(role==='client'){setStatus('RECONNECTING',true);scheduleReconnect();render()}});hostConn.on('error',()=>{setStatus('RECONNECTING',true);scheduleReconnect()});setTimeout(()=>{if(role==='client'&&!hasJoined&&(!hostConn||!hostConn.open))scheduleReconnect()},4500)}catch(e){setStatus('NO CONNECTION',true);scheduleReconnect()}}
 function scheduleReconnect(){if(role!=='client'||reconnectTimer||reconnecting)return;reconnectTimer=setTimeout(()=>{reconnectTimer=null;tryReconnect()},3500)}
 function tryReconnect(){if(role!=='client'||reconnecting)return;reconnecting=true;setStatus('RECONNECTING',true);try{hostConn?.close()}catch{};startClientPeer();setTimeout(()=>{reconnecting=false;if(role==='client'&&(!hostConn||!hostConn.open)){scheduleReconnect()}},4500)}
 function attachPlayer(conn){conn.on('data',msg=>{if(!msg||typeof msg!=='object')return;if(!conn.open)return;if(msg.type==='join'){const id=String(msg.id||'').slice(0,20);const name=String(msg.name||'Player').trim().slice(0,22)||'Player';if(!id||(!players.has(id)&&players.size>=10)){conn.send({type:'error',message:'Room full'});conn.close();return}const p=players.get(id)||{id,name,score:0,correct:false,hinted:false,lastAward:0};p.name=name;p.connected=true;players.set(id,p);for(const [cId,x] of peers)if(x.id===id&&cId!==conn.peer){try{x.conn.close()}catch{}peers.delete(cId)}peers.set(conn.peer,{id,conn});conn.send({type:'state',state:snapshot(id)});broadcast()}else{const link=peers.get(conn.peer);if(link)dispatch(msg,link.id)}});conn.on('close',()=>{const p=peers.get(conn.peer);if(p){peers.delete(conn.peer);const pl=players.get(p.id);if(pl){pl.connected=false;broadcast()}}});conn.on('error',()=>{})}
 function deckForSettings(){let list=cards.filter(c=>(settings.category==='All'||c.cat===settings.category)&&(settings.difficulty==='all'||String(c.level)===String(settings.difficulty)));if(!list.length)list=cards;settings.rounds=Math.min(settings.rounds,list.length);return shuffle(list).slice(0,settings.rounds)}
 function snapshot(id){const p=players.get(id)||{};let remaining=stage==='round'?Math.max(0,endsAt-Date.now()):0;return {type:'state',phase:stage,hostId:hostId(),code:room,players:[...players.values()].map(x=>({id:x.id,name:x.name,score:x.score,correct:x.correct,connected:x.connected})),me:{score:p.score||0,correct:!!p.correct,hinted:!!p.hinted,lastAward:p.lastAward||0,hint:p.hinted?current?.h||'':''},settings,roundNo,remainingMs:remaining,card:current?{g:current.g,cat:current.cat,h:stage==='reveal'?current.h:undefined}:null,answer:stage==='reveal'?current?.a:undefined}}
 function sendTo(id,msg){if(id===clientId)return;for(const x of peers.values())if(x.id===id&&x.conn.open){try{x.conn.send(msg)}catch{}}}
 function broadcast(){if(role!=='host')return;for(const p of players.values())sendTo(p.id,{type:'state',state:snapshot(p.id)});render()}
 function dispatch(m,id=clientId){if(role==='client'){if(hostConn?.open){hostConn.send(m);if(m.type==='guess')lastWrong='Checking your answer…';render()}else{message('Trying to reconnect. Check your internet and try again.')}return}if(role!=='host')return;const p=players.get(id);if(!p)return;switch(m.type){case 'start':if(id!==clientId||stage!=='lobby')return;roundNo=0;startRound();break;case 'guess':if(stage!=='round'||p.correct||Date.now()>=endsAt)return;const guess=String(m.guess||'').slice(0,85);if(norm(guess)===norm(current?.a)){p.correct=true;const fast=[...players.values()].some(x=>x.correct&&x.id!==id);const award=(p.hinted?1:2)+(fast?0:1);p.score+=award;p.lastAward=award;lastWrong='';if([...players.values()].filter(x=>x.connected).every(x=>x.correct))revealRound()}else if(id===clientId)lastWrong='Not quite — try saying it out loud!';else sendTo(id,{type:'feedback',message:'Not quite — try saying it aloud!'});break;case 'hint':if(stage==='round'&&!p.correct)p.hinted=true;break;case 'next':if(stage!=='reveal'||id!==clientId)return;if(roundNo>=deck.length){stage='finished';current=null}else startRound();break;case 'again':if(id!==clientId||stage!=='finished')return;for(const x of players.values()){x.score=0;x.correct=false;x.hinted=false;x.lastAward=0}roundNo=0;deck=deckForSettings();stage='lobby';break;default:return}broadcast()}
 function startRound(){if(role!=='host')return;roundNo++;current=deck[roundNo-1];if(!current){stage='finished';return}stage='round';endsAt=Date.now()+settings.seconds*1000;for(const p of players.values()){p.correct=false;p.hinted=false;p.lastAward=0}lastWrong=''}
 function revealRound(){stage='reveal';endsAt=0}
 function tick(){if(role==='host'&&stage==='round'&&Date.now()>=endsAt){revealRound();broadcast()}updateTimer()}
 function updateTimer(){const el=$('timerText'),ring=$('timerRing');if(!el)return;const s=gameState();let ms=0;if(role==='host')ms=Math.max(0,endsAt-Date.now());else if(s.phase==='round'){if(!window._stateEndTime||window._stateRound!==s.roundNo){window._stateEndTime=Date.now()+s.remainingMs;window._stateRound=s.roundNo}ms=Math.max(0,window._stateEndTime-Date.now())}let sec=s.phase==='round'?Math.ceil(ms/1000):0;el.textContent=sec;ring.style.setProperty('--pct',Math.max(0,Math.min(100,100*ms/(Number(s.settings.seconds||60)*1000))));ring.classList.toggle('low',sec<=10)}
 function startTicker(){clearInterval(ticker);ticker=setInterval(tick,250)}
 function cleanup(){role='';room='';phase='home';stage='lobby';hasJoined=false;remoteState=null;reconnecting=false;clearTimeout(reconnectTimer);clearInterval(ticker);reconnectTimer=null;try{hostConn?.close()}catch{}try{for(const x of peers.values())x.conn.close()}catch{}try{peer?.destroy()}catch{}peers.clear();players.clear();peer=null;hostConn=null;lastWrong='';setStatus('READY');history.replaceState(null,'',location.pathname);render()}
 function inviteLink(){if(location.protocol.startsWith('http')&&location.hostname!=='appassets.androidplatform.net'&&!location.hostname.match(/^localhost$/))return location.origin+location.pathname+'?room='+encodeURIComponent(room);return ''}
 async function shareInvite(){const url=inviteLink();const shareText=`Play Say What?! with me! Room code: ${room}${url?'\n'+url:'\nOpen your copy of Say What?! and enter this code.'}`;try{if(navigator.share){await navigator.share({title:'Say What?! Multiplayer',text:shareText});return}}catch(err){if(err?.name==='AbortError')return}try{await navigator.clipboard.writeText(shareText);message('Invitation copied — paste it into WhatsApp!')}catch{message(`Share this room code with your friends: ${room}`)}}
 async function copyCode(){try{await navigator.clipboard.writeText(room);message('Code '+room+' copied. Send it to your friends!')}catch{message('Room code: '+room)}}
 // A resumed player must rejoin the room. Only the host keeps the game state.
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&role==='client'&&!hostConn?.open)scheduleReconnect()});
 window.addEventListener('online',()=>{if(role==='client'&&!hostConn?.open)scheduleReconnect();if(role==='host'&&peer?.disconnected)try{peer.reconnect()}catch{}});
 window.addEventListener('beforeunload',()=>{try{hostConn?.close()}catch{}});
 startTicker();setStatus('READY');render();
})();
